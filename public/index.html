<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prologue Interviewer · Console</title>
<style>
  :root{ --paper:#F4F1EA; --ink:#17150F; --muted:#6B6455; --accent:#B4410E; --line:#DDD6C7; --card:#FFFDF8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:28px 20px 64px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font:400 30px/1.2 ui-serif,Georgia,serif;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 28px;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
  .opt{color:#A79E8B;font-style:italic}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  button.ghost{background:transparent;color:var(--ink)}
  .quick{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
  .quick p{font-size:13px;color:var(--muted);margin:0}
  input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  textarea{min-height:72px;resize:vertical}
  button{font:inherit;font-weight:550;border-radius:9px;padding:10px 18px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);cursor:pointer;margin-top:16px}
  button.ghost{background:transparent;color:var(--ink)}
  button:disabled{opacity:.4;cursor:default}
  .stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:22px}
  .stat b{display:block;font:400 32px/1 ui-serif,Georgia,serif}
  .stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .link{background:#fff;border:1px dashed var(--accent);border-radius:9px;padding:12px;
    margin-top:14px;font-size:13px;word-break:break-all}
  .link a{color:var(--accent)}
  #qr{margin-top:12px;display:flex;justify-content:center}
  .row{border-top:1px solid var(--line);padding:14px 0}
  .row:first-of-type{border-top:0}
  .row .who{font-weight:600}
  .row .meta{font-size:12px;color:var(--muted)}
  .row .nail{font:400 17px/1.35 ui-serif,Georgia,serif;margin-top:6px}
  .row .q{font-size:13px;color:var(--muted);font-style:italic;margin-top:4px}
  .empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Prologue Interviewer</h1>
  <p class="sub">Hand out an assignment. Get back copy. The interview runs itself.</p>

  <div class="grid">
    <div class="card">
      <h2>New assignment</h2>
      <label>Who are we talking to</label>
      <input id="subjectName" placeholder="Marcus Webb" />
      <label>Their role</label>
      <input id="subjectRole" placeholder="owner" />
      <label>Business <span class="opt">optional</span></label>
      <input id="company" placeholder="Red Bird Tacos" />
      <label>The angle, in one sentence <span class="opt">optional</span></label>
      <textarea id="angle" placeholder="Why a line forms outside a stall nobody advertises."></textarea>
      <div class="two">
        <div>
          <label>Minutes</label>
          <input id="durationMinutes" type="number" value="10" min="2" max="30" />
        </div>
        <div>
          <label>Max questions <span class="opt">optional</span></label>
          <input id="maxQuestions" type="number" placeholder="no limit" min="2" max="40" />
        </div>
      </div>
      <label>Language</label>
      <select id="language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <button id="go">Create &amp; open room</button>
      <div id="out"></div>

      <div class="quick">
        <p>Or hand someone the link and let the interviewer do the asking — it
           collects their name and what they do out loud, then starts.</p>
        <button class="ghost" id="quick">Open a self-serve room</button>
      </div>
    </div>

    <div class="card">
      <h2>The wall</h2>
      <div class="stats" id="stats"></div>
      <div id="wall" class="empty">Nothing finished yet.</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);

$("go").onclick = async () => {
  const body = {
    subjectName: $("subjectName").value.trim(),
    subjectRole: $("subjectRole").value.trim() || undefined,
    company: $("company").value.trim(),
    angle: $("angle").value.trim(),
    durationMinutes: Number($("durationMinutes").value) || 10,
    maxQuestions: Number($("maxQuestions").value) || undefined,
    language: $("language").value,
  };
  if (!body.subjectName) {
    $("out").innerHTML = '<div class="link">Who are we talking to?</div>';
    return;
  }
  $("go").disabled = true;
  try {
    const a = await post("/api/assignments", body);
    const i = await post("/api/interviews", { assignmentId: a.id });
    $("out").innerHTML =
      `<div class="link">Hand them this:<br><a href="${i.url}" target="_blank">${i.url}</a>
       <br><br><a href="${i.url}?operator=1" target="_blank">open with live reasoning →</a></div>
       <div id="qr"></div>`;
    new QRCode($("qr"), { text: i.url, width: 148, height: 148, colorDark: "#17150F", colorLight: "#FFFDF8" });
  } catch (e) {
    $("out").innerHTML = `<div class="link">${e.message}</div>`;
  }
  $("go").disabled = false;
};

$("quick").onclick = async () => {
  $("quick").disabled = true;
  try {
    const i = await post("/api/quickstart", {
      durationMinutes: Number($("durationMinutes").value) || 10,
      maxQuestions: Number($("maxQuestions").value) || undefined,
      language: $("language").value,
    });
    $("out").innerHTML =
      `<div class="link">Self-serve room — it'll ask who they are:<br>
       <a href="${i.url}" target="_blank">${i.url}</a>
       <br><br><a href="${i.url}?operator=1" target="_blank">open with live reasoning →</a></div>
       <div id="qr"></div>`;
    new QRCode($("qr"), { text: i.url, width: 148, height: 148, colorDark: "#17150F", colorLight: "#FFFDF8" });
  } catch (e) {
    $("out").innerHTML = `<div class="link">${e.message}</div>`;
  }
  $("quick").disabled = false;
};

async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

async function wall() {
  try {
    const w = await (await fetch("/api/wall")).json();
    const s = w.stats;
    $("stats").innerHTML = [
      ["interviews", s.interviewsFinished],
      ["minutes on the record", s.minutesOnTheRecord],
      ["questions asked", s.questionsAsked],
    ].map(([label, n]) => `<div class="stat"><b>${n}</b><span>${label}</span></div>`).join("");

    $("wall").className = w.rows.length ? "" : "empty";
    $("wall").innerHTML = w.rows.length
      ? w.rows.map((r) => `
          <div class="row">
            <div class="who">${esc(r.subject || "")} <span class="meta">· ${esc(r.company || "")}</span></div>
            <div class="meta">${r.minutes} min · ${r.questions} questions</div>
            ${r.nail ? `<div class="nail">${esc(r.nail)}</div>` : ""}
            ${r.topQuote ? `<div class="q">“${esc(r.topQuote)}”</div>` : ""}
          </div>`).join("")
      : "Nothing finished yet.";
  } catch {}
}
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
wall(); setInterval(wall, 5000);
</script>
</body>
</html>
